        /* カメラ: 録画座標（1920x1080）で組み、0.75 倍して #s5-view に入れる */
        #s5-cam {
          position: absolute;
          left: 0;

          width: 1920px;
          height: 1080px;
          transform-origin: 0 0;
        }
        #s5-cam video {
          position: absolute;
          left: 0;
          top: 0;
          width: 1920px;
          height: 1080px;
          object-fit: cover;

        #s5-flow {
          position: relative;
          height: 46px;
          width: 340px;
        }
        #s5-flow .chip {
          position: absolute;
          left: 0;
          top: 0;
          opacity: 0;
        }
        #s5-ff {
          position: absolute;
          right: 28px;
          top: 72px;
          padding: 14px 28px;
          border-radius: 999px;
          background: var(--ink);
          color: #fff;
          font-size: 32px;
          font-weight: 500;
          box-shadow: var(--shadow-3);
          opacity: 0;
        }
        .s5-hl {
          position: absolute;
          border: 6px solid var(--yellow);
          border-radius: 14px;
          box-shadow: 0 0 0 4000px rgba(32, 33, 36, 0.35);
          opacity: 0;
        }
        .s5-ripple {
          position: absolute;
          width: 120px;
          height: 120px;
          margin: -60px 0 0 -60px;
          border-radius: 50%;
          border: 8px solid var(--blue);
          opacity: 0;
        }
        /* 字幕 */
        #s5-cap {
          position: absolute;
          left: 50%;
          bottom: 44px;
          width: 1400px;
          margin-left: -700px;
          display: flex;
          justify-content: center;
        }
        .s5-line {
          position: absolute;
          bottom: 0;
          display: flex;
          align-items: center;
          gap: 18px;
          padding: 20px 34px;
          border-radius: 18px;
          background: #fff;
          box-shadow: var(--shadow-3);
          font-size: 34px;
          font-weight: 500;
          color: var(--ink);
          white-space: nowrap;
          opacity: 0;
        }
        .s5-line .step {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 46px;
          height: 46px;
          border-radius: 50%;
          background: var(--blue);
          color: #fff;
          font-size: 24px;
          flex: none;
        }
      </style>

      <div id="root" data-composition-id="s5-demo" data-width="1920" data-height="1080">
        <div class="stage" id="s5-stage">
          <div id="s5-head">
            <span class="eyebrow"><span class="num">4</span>デモ</span>
            <span class="h">本番で動かす</span>
            <span id="s5-flow"><span class="chip blue" id="s5-flow-a">流れ A　締切の準備</span><span class="chip green" id="s5-flow-b">流れ B　定期の仕事</span></span>
            <span class="url">agent-calendar-785713600547.asia-northeast1.run.app/w/demo</span>
          </div>
          <div id="s5-browser">
            <div id="s5-bar">
              <i style="background: #ea4335"></i><i style="background: #fbbc04"></i><i style="background: #34a853"></i>
              <div class="addr">agent-calendar-785713600547.asia-northeast1.run.app/w/demo</div>
            </div>
            <div id="s5-view">
              <div id="s5-cam">
                <!-- 本番を agent-browser で収録した生の動画（scripts/record/record.mjs）。待ちは早送り -->
                <video id="s5-a1" data-hf-media-start-basis="local" src="assets/demo/raw/01-A-form.mp4" muted playsinline data-start="0" data-duration="9" data-media-start="2.5" data-playback-rate="1.5" data-track-index="0"></video>
                <video id="s5-a2" data-hf-media-start-basis="local" src="assets/demo/raw/02-A-wait.mp4" muted playsinline data-start="9" data-duration="1.6" data-media-start="0" data-playback-rate="10" data-track-index="0"></video>
                <video id="s5-a3" data-hf-media-start-basis="local" src="assets/demo/raw/03-A-session.mp4" muted playsinline data-start="10.6" data-duration="3.4" data-media-start="0" data-playback-rate="1.5" data-track-index="0"></video>
                <video id="s5-a4" data-hf-media-start-basis="local" src="assets/demo/raw/03-A-session.mp4" muted playsinline data-start="14" data-duration="7" data-media-start="9.6" data-playback-rate="1.6" data-track-index="0"></video>
                <video id="s5-a5" data-hf-media-start-basis="local" src="assets/demo/raw/03-A-session.mp4" muted playsinline data-start="21" data-duration="6" data-media-start="22.2" data-playback-rate="1.5" data-track-index="0"></video>
                <video id="s5-a6" data-hf-media-start-basis="local" src="assets/demo/raw/03-A-session.mp4" muted playsinline data-start="27" data-duration="5" data-media-start="31.2" data-playback-rate="1.2" data-track-index="0"></video>
                <video id="s5-b1" data-hf-media-start-basis="local" src="assets/demo/raw-b3/03b-B-form.mp4" muted playsinline data-start="32" data-duration="5.6" data-media-start="6.8" data-playback-rate="1.75" data-track-index="0"></video>
                <video id="s5-b2" data-hf-media-start-basis="local" src="assets/demo/raw-b3/08-B-judge.mp4" muted playsinline data-start="37.6" data-duration="4.4" data-media-start="2.2" data-playback-rate="1.3" data-track-index="0"></video>
                <video id="s5-b3" data-hf-media-start-basis="local" src="assets/demo/raw-b3/06-B-wait.mp4" muted playsinline data-start="42" data-duration="1" data-media-start="152" data-playback-rate="10" data-track-index="0"></video>
                <video id="s5-b4" data-hf-media-start-basis="local" src="assets/demo/raw-b3/06-B-wait.mp4" muted playsinline data-start="43" data-duration="1.8" data-media-start="163.5" data-playback-rate="1" data-track-index="0"></video>
                <video id="s5-b5" data-hf-media-start-basis="local" src="assets/demo/raw-b3/09-B-session.mp4" muted playsinline data-start="44.8" data-duration="2.6" data-media-start="3.8" data-playback-rate="1.3" data-track-index="0"></video>
                <video id="s5-b6" data-hf-media-start-basis="local" src="assets/demo/raw-b3/09-B-session.mp4" muted playsinline data-start="47.4" data-duration="4.6" data-media-start="17.8" data-playback-rate="1" data-track-index="0"></video>
                <div id="s5-marks"></div>
              </div>
              <div id="s5-ff"></div>
            </div>
          </div>
          <div id="s5-cap"></div>
        </div>
      </div>

      <script>
        (function () {
          const D = 52.5;
          // 時刻は s5 の中の秒、座標は収録した 1920x1080 の画面の座標
          // カメラ: [時刻, 中心 x, 中心 y, 倍率, 移動秒（0 はカット）]。倍率 0.75 で画面全体
          const CAM = [
            [0, 960, 540, 0.75, 0], [1.3, 960, 330, 1.3, 0.8], [7.3, 1150, 450, 1.45, 0.6],
            [9, 960, 540, 0.75, 0], [10.6, 960, 200, 1.2, 0], [12.6, 960, 540, 0.75, 0.5],
            [14, 960, 400, 1.25, 0], [17.9, 960, 320, 1.25, 0.6],
            [21, 960, 260, 1.25, 0], [24.6, 960, 640, 1.2, 0.6],
            [27, 960, 600, 1.2, 0], [30.9, 960, 300, 1.2, 0.5],
            [32, 960, 330, 1.3, 0], [37.6, 1150, 450, 1.0, 0], [39.1, 960, 260, 1.45, 0.5],
            [42, 960, 540, 0.75, 0], [43, 960, 200, 1.25, 0], [44.8, 960, 300, 1.0, 0], [47.4, 960, 640, 1.2, 0],
          ];
          // ハイライト: [出, 消, x, y, w, h]
          const HL = [
            [7.7, 9, 1064, 446, 156, 26], [10.8, 12.5, 393, 138, 1134, 66],
            [14.7, 17.6, 392, 340, 1136, 196], [18.6, 20.9, 392, 170, 1136, 310],
            [21.3, 24.4, 392, 150, 1136, 175], [25.4, 26.9, 392, 500, 1136, 420],
            [31.3, 32, 360, 222, 1200, 54],
            [34.3, 36.4, 713, 450, 494, 88], [39.6, 41.9, 712, 170, 496, 185],
            [43.1, 44.8, 393, 141, 1134, 60], [47.6, 52, 393, 481, 1134, 446],
          ];
          // クリックの波紋: [時刻, x, y]
          const RIP = [[1.03, 1464, 273], [2.57, 1181, 105], [6.2, 819, 582], [13.35, 960, 540], [28.35, 462, 627], [32.26, 1105, 105], [36.6, 819, 578], [38.1, 1192, 451], [45.29, 960, 170]];
          // 字幕: [出, 消, 流れ, 文]
          const CAP = [
            [0.2, 3.2, "A", "「予定を追加」から、記録用カレンダーに締切を入れる"],
            [3.2, 7.3, "A", "期日は 10/30。準備は 30 日前から"],
            [7.3, 9, "A", "記録用カレンダーに締切が入った"],
            [9, 10.6, "A", "1 分ごとの取得が、締切の準備に気づく"],
            [10.6, 14, "A", "準備のセッションが始まる（開始日を過ぎていたので「遅れて登録」）"],
            [14, 17.6, "A", "締切の中身は <untrusted> で囲み、事実として渡す"],
            [17.6, 21, "A", "agent は tool で予定を提案する。まだカレンダーには入らない"],
            [21, 25, "A", "期日から逆算した 3 つの準備"],
            [25, 27, "A", "提案は承認待ちに並ぶ"],
            [27, 32, "A", "「承認して追加」を押して、初めて記録用カレンダーに入る"],
            [32, 34.2, "B", "「予定を追加」から、起動用カレンダーに定期の仕事を入れる"],
            [34.2, 37.6, "B", "notes に、やってほしいことを自然言語で書く"],
            [37.6, 42, "B", "予定を開くと、Gemini の判定（実行先・agent・prompt）が見える"],
            [42, 44.8, "B", "開始時刻に、cloud の使い捨て sandbox で agent が起動する"],
            [44.8, 47.4, "B", "終わったセッションを開く"],
            [47.4, 52.5, "B", "調べた結果が、出典つきでセッションに残る"],
          ];
          // 早送りの表示: [出, 消, 文]
          const FF = [[9, 10.6, "▶▶ 早送り　1 分後"], [42, 43, "▶▶ 早送り　開始時刻 01:21"]];

          const marks = document.querySelector("#s5-marks");
          const capBox = document.querySelector("#s5-cap");
          const ffBox = document.querySelector("#s5-ff");
          const tl = gsap.timeline({ paused: true });
          window.ACSeam.enter(tl, "#s5-stage");

          const camAt = (cx, cy, sc) => ({
            scale: sc,
            x: Math.min(0, Math.max(1440 - 1920 * sc, 720 - cx * sc)),
            y: Math.min(0, Math.max(810 - 1080 * sc, 405 - cy * sc)),
          });
          gsap.set("#s5-cam", camAt(960, 540, 0.75));
          CAM.forEach(([t, cx, cy, sc, d]) => {
            if (d) tl.to("#s5-cam", { ...camAt(cx, cy, sc), duration: d, ease: "power2.inOut" }, t);
            else tl.set("#s5-cam", camAt(cx, cy, sc), t);
          });
          HL.forEach(([a, b, x, y, w, h]) => {
            const el = document.createElement("div");
            el.className = "s5-hl";
            Object.assign(el.style, { left: `${x - 10}px`, top: `${y - 8}px`, width: `${w + 20}px`, height: `${h + 16}px` });
            marks.appendChild(el);
            tl.fromTo(el, { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out", immediateRender: false }, a);
            tl.to(el, { opacity: 0, duration: 0.15 }, b - 0.15);
          });
          RIP.forEach(([t, x, y]) => {
            const el = document.createElement("div");
            el.className = "s5-ripple";
            Object.assign(el.style, { left: `${x}px`, top: `${y}px` });
            marks.appendChild(el);
            tl.fromTo(el, { opacity: 1, scale: 0.3 }, { opacity: 0, scale: 1.6, duration: 0.6, ease: "power2.out", immediateRender: false }, t);
          });
          CAP.forEach(([a, b, flow, text], i) => {
            const el = document.createElement("div");
            el.className = "s5-line";
            const st = document.createElement("span");
            st.className = "step";
            st.textContent = flow;
            if (flow === "B") st.style.background = "var(--green)";
            el.append(st, document.createTextNode(text));
            capBox.appendChild(el);
            tl.fromTo(el, { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, a);
            if (i < CAP.length - 1) tl.to(el, { opacity: 0, duration: 0.12 }, b - 0.12);
          });
          FF.forEach(([a, b, text]) => {
            tl.set(ffBox, { textContent: text }, a);
            tl.fromTo(ffBox, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.2, immediateRender: false }, a);
            tl.to(ffBox, { opacity: 0, duration: 0.15 }, b - 0.15);
          });
          // 見出しの流れ A / B
          tl.to("#s5-flow-a", { opacity: 1, duration: 0.2 }, 0.2);
          tl.to("#s5-flow-a", { opacity: 0, duration: 0.15 }, /*BSTART*/32 - 0.15);
          tl.fromTo("#s5-flow-b", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, immediateRender: false }, /*BSTART*/32);

          window.ACSeam.exit(tl, "#s5-stage", D);
          window.__timelines["s5-demo"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
