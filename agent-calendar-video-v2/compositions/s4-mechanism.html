        (function () {

          const panels = ["#s4-p1", "#s4-p2", "#s4-p3", "#s4-p4", "#s4-p5", "#s4-p6"];
          const NODE_X = [240, 480, 720, 960, 1200, 1440, 1680];

          // 初期状態
          gsap.set(panels, { opacity: 0 });
 gsap.set(["#s4-fly", "#s4-cursor", "#s4-ripple", "#s4-session", "#s4-t6b", "#s4-st-ok", "#s4-calc-b"], { opacity: 0 });
          gsap.set(".s4-log div, .s4-steps div, .s4-judge", { opacity: 0 });
          gsap.set("#s4-fill", { scaleX: 0 });
          gsap.set("#s4-dot", { opacity: 0 });
          gsap.set("#s4-bolt .core", { scale: 0.7, opacity: 0.4 });
          gsap.set("#s4-bolt .ring", { opacity: 0 });

          window.ACSeam.enter(tl, "#s4-stage");

          // 見出しと線
 tl.fromTo("#s4-eyebrow", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power4.out" }, 0.1);
 tl.fromTo("#s4-h1", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power4.out" }, 0.18);
 tl.fromTo(nodes, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, stagger: 0.06, ease: "power4.out" }, 0.3);
          tl.fromTo("#s4-track", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.3);

          // 段の点灯
          function light(i, t) {
            const n = nodes[i];
 tl.to(n.querySelector(".c"), { borderColor: "#4285f4", backgroundColor: "#e8f0fe", duration: 0.25 }, t);
 tl.fromTo(n.querySelector(".c"), { scale: 1 }, { immediateRender: false, scale: 1.12, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, t);
            tl.to(n.querySelector(".l"), { color: "#202124", duration: 0.25 }, t);
          }
          // 点を次の段へ運ぶ（到着が点灯の時刻）
          function travel(i, arrive) {
            const dur = 0.6;
 tl.to("#s4-dot", { x: NODE_X[i] - NODE_X[0], duration: dur, ease: "power2.inOut" }, arrive - dur);
            tl.to("#s4-fill", { scaleX: i / 6, duration: dur, ease: "power2.inOut" }, arrive - dur);
          }
          // パネルの入れ替え（左向きの流れ）
          function swap(from, to, t) {
            if (from) {
              tl.to(from, { x: -140, duration: 0.3, ease: "power4.in" }, t - 0.3);
              tl.to(from, { opacity: 0, duration: 0.2, ease: "none" }, t - 0.24);
            }
 tl.fromTo(to, { x: 140, opacity: 0.35 }, { immediateRender: false, x: 0, opacity: 1, duration: 0.45, ease: "power4.out" }, t);
          }

          // 1 予定（1.0s）
          tl.set("#s4-dot", { opacity: 1 }, 0.9);
 tl.fromTo("#s4-dot", { scale: 0 }, { immediateRender: false, scale: 1, duration: 0.3, ease: "back.out(1.7)" }, 0.9);
          light(0, 1.0);
          swap(null, "#s4-p1", 1.0);
 tl.fromTo("#s4-p1 .s4-ev", { x: 60, opacity: 0 }, { immediateRender: false, x: 0, opacity: 1, duration: 0.4, stagger: 0.15, ease: "power4.out" }, 1.3);

          // 2 取得（3.5s）: 時計が 2 周し、1 分ごとの取得が記録される
          travel(1, 3.5);
          light(1, 3.5);
          swap("#s4-p1", "#s4-p2", 3.5);
 tl.fromTo("#s4-hand", { rotation: 0 }, { immediateRender: false, rotation: 1080, duration: 3.0, ease: "none" }, 3.8);
