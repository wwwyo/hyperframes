      <script>
        (function () {
          const D = 28;
          const tl = gsap.timeline({ paused: true });
          const q = (s) => document.querySelector(s);

          // 点 A から点 B へ伸びる破線（rotation と scaleX は GSAP で持つ）
          function line(sel, ax, ay, bx, by) {
            const el = q(sel);
            el.style.left = ax + "px";
            el.style.top = ay + "px";
            el.style.width = Math.hypot(bx - ax, by - ay) + "px";
            gsap.set(el, { rotation: (Math.atan2(by - ay, bx - ax) * 180) / Math.PI, scaleX: 0 });
          }
          function place(sel, x, y) {
            q(sel).style.left = x + "px";
            q(sel).style.top = y + "px";
          }
          // 自分の予定（250,190)-(550,400) の手前で止まる線
          line("#s2-l1", 200, 104, 262, 168);
          place("#s2-x1", 270, 176);
          line("#s2-l2", 600, 104, 538, 168);
          place("#s2-x2", 530, 176);
          line("#s2-l3", 400, 434, 400, 420);
          place("#s2-x3", 400, 417);

          // 初期状態
          gsap.set(["#s2-p2", "#s2-p3", ".s2-slot", "#s2-final-head", ".s2-fcard"], { opacity: 0 });
          gsap.set(["#s2-late", ".s2-x", ".s2-qchip", "#s2-agentread"], { opacity: 0 });

          window.ACSeam.enter(tl, "#s2-stage");

          // 課題の面の入り（番号 → 見出し → 説明の waterfall）
          function panelIn(p, t) {
            tl.set(p, { opacity: 1 }, t);
            tl.fromTo(p, { y: 60 }, { y: 0, duration: 0.5, ease: "power4.out" }, t);
            tl.fromTo(p + " .s2-no", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.6)" }, t + 0.1);
            tl.fromTo(p + " .h1", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power4.out" }, t + 0.25);
            tl.fromTo(p + " .lead", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power4.out" }, t + 0.6);
          }
          // 課題の面が縮んで下の並びへ収まる
          function panelToSlot(p, slotLeft, slot, t) {
            const s = 540 / 1680;
            tl.to(p, { x: slotLeft - 120, y: 840 - 160, scale: s, transformOrigin: "0 0", duration: 0.6, ease: "power3.inOut" }, t);
            tl.to(p, { opacity: 0, duration: 0.25, ease: "none" }, t + 0.4);
            tl.fromTo(slot, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t + 0.45);
          }

          // ---- 01（0.4〜8.6s）: 「今日」が期日へ進み、30日前の印を通り過ぎる ----
          panelIn("#s2-p1", 0.4);
          tl.fromTo("#s2-ev", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power4.out" }, 1.0);
          tl.fromTo(["#s2-track", ".s2-tick", ".s2-ticklbl", "#s2-today", "#s2-count"], { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.05 }, 1.3);
          const days = { v: 40 };
          const showDays = () => (q("#s2-days").textContent = String(Math.round(days.v)));
          tl.fromTo("#s2-today", { x: 0 }, { x: 666, duration: 4.2, ease: "power1.inOut" }, 2.1);
          tl.fromTo("#s2-trackfill", { scaleX: 0 }, { scaleX: 666 / 720, duration: 4.2, ease: "power1.inOut" }, 2.1);
          tl.fromTo(days, { v: 40 }, { v: 3, duration: 4.2, ease: "power1.inOut", onUpdate: showDays }, 2.1);
          tl.to("#s2-t30l", { color: "#80868b", duration: 0.4 }, 3.6);
          tl.to("#s2-days", { color: "#c5221f", duration: 0.3 }, 6.0);
          tl.to("#s2-trackfill", { backgroundColor: "#ea4335", duration: 0.3 }, 6.0);
          tl.fromTo("#s2-late", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, 6.6);
          panelToSlot("#s2-p1", 120, "#s2-slot1", 8.0);

          // ---- 02（8.7〜16.2s）: 設定がばらばらで、自分の予定に届かない ----
          panelIn("#s2-p2", 8.7);
          tl.fromTo("#s2-mycal", { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.5)" }, 9.3);
          tl.fromTo("#s2-mycal .row", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.35, stagger: 0.08, ease: "power3.out" }, 9.6);
          tl.fromTo("#s2-cron", { x: -60, y: -40, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.45, ease: "power4.out" }, 9.9);
          tl.fromTo("#s2-rout", { x: 60, y: -40, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.45, ease: "power4.out" }, 10.1);
