<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>1 フック</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          background: var(--bg2);
        }
        #s1-event-label {
          position: absolute;
          left: 120px;
          top: 52px;
          font-size: 24px;
          color: var(--ink2);
          letter-spacing: 0.03em;
        }
        /* 週表示のカレンダー */
        #s1-cal {
          position: absolute;
          left: 120px;
          top: 110px;
          width: 1680px;
          height: 880px;
          padding: 28px 32px 0;
          overflow: hidden;
        }
        .s1-calhead {
          display: flex;
          align-items: center;
          gap: 20px;
          height: 64px;
          font-size: 34px;
          font-weight: 500;
        }
        .s1-calhead img {
          width: 48px;
          height: 48px;
        }
        .s1-calhead .sub {
          margin-left: auto;
          font-size: 24px;
          color: var(--ink2);
          font-weight: 400;
        }
        .s1-days {
          display: grid;
          grid-template-columns: 90px repeat(5, 1fr);
          margin-top: 18px;
          border-bottom: 1px solid var(--line);
        }
        .s1-day {
          padding: 6px 0 14px;
          text-align: center;
          font-size: 22px;
          color: var(--ink2);
        }
        .s1-day b {
          display: block;
          font-size: 38px;
          font-weight: 400;
          color: var(--ink);
          margin-top: 4px;
        }
        .s1-grid {
          position: relative;
          display: grid;
          grid-template-columns: 90px repeat(5, 1fr);
          height: 660px;
        }
        .s1-hour {
          position: absolute;
          left: 0;
          right: 0;
          height: 1px;
          background: var(--line);
        }
        .s1-hour span {
          position: absolute;
          left: 6px;
          top: -14px;
          font-size: 20px;
          color: var(--ink3);
          background: #fff;
          padding-right: 8px;
        }
        .s1-col {
          border-left: 1px solid var(--line);
        }
        .s1-ev {
          position: absolute;
          border-radius: 10px;
          padding: 10px 14px;
          font-size: 22px;
          line-height: 1.35;
          color: #fff;
        }
        .s1-ev small {
          display: block;
          font-size: 18px;
          opacity: 0.9;
        }
        /* 予定の詳細（ポップアップ） */
        #s1-pop {
          position: absolute;
          left: 760px;
          top: 300px;
          width: 700px;
          padding: 36px 40px 40px;
          border-radius: 20px;
          background: #fff;
          box-shadow: var(--shadow-3);
        }
        #s1-pop .t {
          display: flex;
          align-items: center;
          gap: 18px;
          font-size: 38px;
          font-weight: 500;
        }
        #s1-pop .t i {
          width: 26px;
          height: 26px;
          border-radius: 6px;
          background: var(--green);
        }
        #s1-pop .d {
          margin: 10px 0 0 44px;
          font-size: 26px;
          color: var(--ink2);
        }
        #s1-pop .cal {
          margin: 6px 0 0 44px;
          font-size: 24px;
          color: var(--green-ink);
        }
        #s1-notes {
          margin: 26px 0 0 44px;
          padding: 18px 22px;
          border-radius: 10px;
          background: var(--bg3);
          font-size: 34px;
          min-height: 82px;
          display: flex;
          align-items: center;
        }
        #s1-notes .lbl {
          font-size: 22px;
          color: var(--ink2);
          margin-right: 18px;
        }
        #s1-caret {
          display: inline-block;
          width: 3px;
          height: 40px;
          background: var(--blue-ink);
          margin-left: 2px;
        }
        /* agent が動き出した印 */
        #s1-agent {
          position: absolute;
          left: 760px;
          top: 676px;
          width: 700px;
          display: flex;
          align-items: center;
          gap: 22px;
          padding: 24px 30px;
          border-radius: 20px;
          background: var(--blue-ink);
          color: #fff;
          box-shadow: var(--shadow-3);
        }
        #s1-agent .dot {
          width: 52px;
          height: 52px;
          border-radius: 50%;
          background: #fff;
          display: flex;
          align-items: center;
          justify-content: center;
          flex: none;
        }
        #s1-agent .dot svg {
          width: 34px;
          height: 34px;
        }
        #s1-agent .a {
          font-size: 32px;
          font-weight: 500;
        }
        #s1-agent .b {
          font-size: 24px;
          opacity: 0.92;
          margin-top: 4px;
        }
        /* タイトル */
        #s1-title {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 30px;
        }
        #s1-dots {
          display: flex;
          gap: 16px;
        }
        #s1-dots i {
          width: 26px;
          height: 26px;
          border-radius: 50%;
        }
        #s1-name {
          font-size: 150px;
          font-weight: 600;
          letter-spacing: -0.02em;
          display: flex;
          gap: 40px;
        }
        #s1-name span {
          display: block;
        }
        #s1-tag {
          font-size: 44px;
          color: var(--ink2);
          display: flex;
          gap: 0;
        }
        #s1-tag span {
          display: block;
        }
        #s1-hack {
          font-size: 26px;
          color: var(--ink3);
          margin-top: 20px;
          letter-spacing: 0.03em;
        }
      </style>

      <div id="root" data-composition-id="s1-hook" data-width="1920" data-height="1080">
        <div class="stage" id="s1-stage">
          <div id="s1-event-label">第5回 Agentic AI Hackathon with Google Cloud</div>

          <div id="s1-calwrap">
            <div id="s1-cal" class="card">
              <div class="s1-calhead">
                <img src="assets/icons/google_calendar.svg" alt="">Google Calendar
                <span class="sub">2026年 10月</span>
              </div>
              <div class="s1-days">
                <div></div>
                <div class="s1-day">月<b>12</b></div>
                <div class="s1-day">火<b>13</b></div>
                <div class="s1-day">水<b>14</b></div>
                <div class="s1-day">木<b>15</b></div>
                <div class="s1-day">金<b>16</b></div>
              </div>
              <div class="s1-grid">
                <div class="s1-hour" style="top: 30px"><span>9:00</span></div>
                <div class="s1-hour" style="top: 160px"><span>11:00</span></div>
                <div class="s1-hour" style="top: 290px"><span>13:00</span></div>
                <div class="s1-hour" style="top: 420px"><span>15:00</span></div>
                <div class="s1-hour" style="top: 550px"><span>17:00</span></div>
                <div></div>
                <div class="s1-col"></div>
                <div class="s1-col"></div>
                <div class="s1-col"></div>
                <div class="s1-col"></div>
                <div class="s1-col"></div>
                <div data-layout-allow-overlap="" class="s1-ev s1-ctx" style="left: 100px; top: 40px; width: 290px; height: 80px; background: #7986cb">
                  定例<small>9:00〜10:00</small>
                </div>
                <div data-layout-allow-overlap="" class="s1-ev s1-ctx" style="left: 410px; top: 300px; width: 290px; height: 110px; background: #7986cb">
                  設計レビュー<small>13:00〜14:30</small>
                </div>
                <div data-layout-allow-overlap="" class="s1-ev s1-ctx" style="left: 100px; top: 430px; width: 290px; height: 80px; background: #7986cb">
                  1on1<small>11:00〜12:00</small>
                </div>
                <div data-layout-allow-overlap="" class="s1-ev s1-ctx" style="left: 1030px; top: 430px; width: 290px; height: 110px; background: #7986cb">
                  買い物<small>15:00〜16:30</small>
                </div>
                <div id="s1-deadline" class="s1-ev" style="
                    left: 1340px;
                    top: 40px;
                    width: 296px;
                    height: 120px;
                    background: var(--green);
                  ">
                  パスポート更新 締切<small>記録用カレンダー</small>
                </div>
              </div>
            </div>

            <div id="s1-pop" data-layout-allow-overlap="">
              <div class="t"><i></i>パスポート更新 締切</div>
              <div class="d">10月16日（金）</div>
              <div class="cal">記録用カレンダー</div>
              <div id="s1-notes">
                <span class="lbl">notes</span><span id="s1-typed"></span><span id="s1-caret"></span>
              </div>
            </div>

            <div id="s1-agent" data-layout-allow-overlap="">
              <div class="dot">
                <svg viewBox="0 0 24 24">
                  <path d="M12 2c.6 4.9 5.1 9.4 10 10-4.9.6-9.4 5.1-10 10-.6-4.9-5.1-9.4-10-10 4.9-.6 9.4-5.1 10-10z" fill="#1a73e8" />
                </svg>
              </div>
              <div>
                <div class="a">30日前に、agent が準備を始める</div>
                <div class="b">段取りを考えて、準備の予定を提案する</div>
              </div>
            </div>
          </div>

          <div id="s1-title">
            <div id="s1-dots">
              <i style="background: #4285f4"></i><i style="background: #ea4335"></i><i style="background: #fbbc04"></i><i style="background: #34a853"></i>
            </div>
            <div id="s1-name"><span>Agent</span><span>Calendar</span></div>
            <div id="s1-tag"></div>
            <div id="s1-hack">Google Calendar に書くだけで、AI agent が動き出す</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const D = 10;
          const tl = gsap.timeline({ paused: true });
          const q = (s) => document.querySelector(s);

          // 文字を 1 字ずつの span に分ける（打鍵とキャッチコピーの waterfall 用）
          function split(el, text) {
            el.textContent = "";
            return [...text].map((c) => {
              const s = document.createElement("span");
              s.textContent = c;
              s.style.display = "inline-block";
              s.style.whiteSpace = "pre";
              el.appendChild(s);
              return s;
            });
          }
          const typed = split(q("#s1-typed"), "準備: 30日前");
          const tag = split(
            q("#s1-tag"),
            "予定と締切を書いておくと、agent が準備と定期の仕事を自分で始める",
          );

          // 初期状態
          gsap.set(["#s1-deadline", "#s1-pop", "#s1-agent", "#s1-title", ".s1-ctx"], {
            opacity: 0,
          });
          gsap.set(typed, { opacity: 0 });
          gsap.set(tag, { opacity: 0 });

          window.ACSeam.enter(tl, "#s1-stage");

          // 0.2s カレンダーが組み上がる
          tl.fromTo("#s1-cal", { y: 60 }, { y: 0, duration: 0.7, ease: "power4.out" }, 0.1);
          tl.fromTo(
            ".s1-day",
            { y: 30, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.4, stagger: 0.05, ease: "power4.out" },
            0.3,
          );
          tl.fromTo(
            ".s1-ctx",
            { y: 20, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.4, stagger: 0.07, ease: "power3.out" },
            0.5,
          );

          // 1.1s 締切の予定が置かれる
          tl.fromTo(
            "#s1-deadline",
            { scale: 1.25, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.6)" },
            1.1,
          );

          // 1.7s ポップアップが開く
          tl.fromTo(
            "#s1-pop",
            { y: 40, scale: 0.96, opacity: 0 },
            { y: 0, scale: 1, opacity: 1, duration: 0.45, ease: "power4.out" },
            1.7,
          );

          // 2.2s〜 notes に「準備: 30日前」を打つ
          typed.forEach((s, i) => tl.set(s, { opacity: 1 }, 2.25 + i * 0.13));
          // キャレットの点滅（打ち終わった後の 2 回だけ）
          tl.to("#s1-caret", { opacity: 0, duration: 0.01 }, 3.6);
          tl.to("#s1-caret", { opacity: 1, duration: 0.01 }, 3.85);
          tl.to("#s1-caret", { opacity: 0, duration: 0.01 }, 4.1);

          // 3.6s 間のあと、agent が動き出す
          tl.fromTo(
            "#s1-notes",
            { backgroundColor: "#f1f3f4" },
            { backgroundColor: "#e8f0fe", duration: 0.3 },
            3.7,
          );
          tl.fromTo(
            "#s1-agent",
            { y: -60, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.5, ease: "power4.out" },
            4.0,
          );
          tl.fromTo(
            "#s1-agent .dot svg",
            { rotation: -90, scale: 0.4 },
            { rotation: 0, scale: 1, duration: 0.6, ease: "back.out(1.7)" },
            4.05,
          );

          // 5.6s カレンダーが奥へ退き、製品名が出る
          tl.to(
            "#s1-calwrap",
            { scale: 0.86, y: -40, opacity: 0, duration: 0.6, ease: "power3.in" },
            5.6,
          );
          tl.to("#s1-event-label", { opacity: 0, duration: 0.3 }, 5.6);
          tl.set("#s1-title", { opacity: 1 }, 6.1);
          tl.fromTo(
            "#s1-dots i",
            { y: 50, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.3, stagger: 0.05, ease: "power4.out" },
            6.1,
          );
          tl.fromTo(
            "#s1-name span",
            { y: 80, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.45, stagger: 0.12, ease: "power4.out" },
            6.2,
          );
          tl.fromTo(
            tag,
            { y: 40, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.3, stagger: 0.018, ease: "power4.out" },
            6.8,
          );
          tl.fromTo(
            "#s1-hack",
            { y: 30, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.4, ease: "power4.out" },
            8.0,
          );

          window.ACSeam.exit(tl, "#s1-stage", D);
          window.__timelines["s1-hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
