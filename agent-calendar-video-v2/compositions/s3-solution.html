<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>3 解決の概念</title>
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; background: var(--bg2); }
        #s3-eyebrow { position: absolute; left: 120px; top: 60px; }
        #s3-title { position: absolute; left: 120px; top: 110px; width: 1680px; }
        #s3-title span, #s3-bottom span, .s3-ev .n span.c { display: inline-block; white-space: pre; }
        #s3-title .em { color: var(--blue-ink); }
        /* 起動用・記録用のカード */
        .s3-cal { position: absolute; top: 236px; width: 800px; height: 400px; padding: 30px 36px; display: flex; flex-direction: column; gap: 16px; }
        #s3-auto { left: 120px; border-top: 8px solid var(--blue); }
        #s3-rec { left: 1000px; border-top: 8px solid var(--green); }
        .s3-head { display: flex; align-items: center; gap: 16px; font-size: 40px; font-weight: 600; }
        .s3-head .sq { width: 26px; height: 26px; border-radius: 6px; }
        .s3-head .chip { margin-left: auto; font-size: 28px; padding: 6px 24px; }
        .s3-desc { font-size: 28px; line-height: 1.5; color: var(--ink2); }
        .s3-ev { border-radius: 12px; padding: 14px 20px; border-left: 8px solid; }
        #s3-auto .s3-ev { background: var(--blue-tint); border-color: var(--blue); }
        #s3-rec .s3-ev { background: var(--green-tint); border-color: var(--green); }
        .s3-ev .t { font-size: 28px; font-weight: 500; }
        .s3-ev .n { margin-top: 6px; font-size: 26px; color: var(--ink); min-height: 38px; }
        .s3-ev .n .lbl { font-size: 20px; color: var(--ink2); margin-right: 12px; }
        .s3-out { display: flex; align-items: center; gap: 12px; margin-top: auto; }
        .s3-out .chip { font-size: 24px; }
        .s3-out .arr { width: 40px; height: 24px; }
        /* 矢印とラベル */
        #s3-svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
        .s3-label { position: absolute; font-size: 22px; padding: 6px 16px; }
        #s3-l1 { left: 1036px; top: 646px; }
        #s3-l2 { left: 1584px; top: 826px; }
        /* 承認待ち */
        #s3-appr { position: absolute; left: 360px; top: 700px; width: 1200px; height: 232px; padding: 24px 36px; border-top: 8px solid var(--yellow); display: flex; gap: 30px; }
        #s3-appr .l { width: 720px; }
        #s3-appr .h { display: flex; align-items: center; gap: 14px; font-size: 36px; font-weight: 600; }
        #s3-appr .h .ic { width: 44px; height: 44px; border-radius: 50%; background: var(--yellow-tint); display: flex; align-items: center; justify-content: center; }
        #s3-appr .h .ic svg { width: 28px; height: 28px; }
        #s3-appr .d { margin-top: 8px; font-size: 26px; line-height: 1.4; color: var(--ink2); }
        #s3-appr .d span { display: block; }
        #s3-prop { width: 380px; padding: 14px 20px; border-radius: 12px; background: var(--bg2); border: 1px solid var(--line); }
        #s3-prop .k { font-size: 20px; color: var(--ink2); }
        #s3-prop .v { font-size: 26px; font-weight: 500; margin-top: 2px; }
        #s3-btn { position: relative; margin-top: 12px; width: 220px; height: 52px; border-radius: 26px; background: var(--green-ink); color: #fff; font-size: 24px; font-weight: 500; display: flex; align-items: center; justify-content: center; }
        #s3-btn .done { position: absolute; inset: 0; border-radius: 26px; background: var(--green-tint); color: var(--green-ink); display: flex; align-items: center; justify-content: center; }
        /* 承認されて記録用カレンダーへ入る予定・カーソル */
        #s3-fly { position: absolute; left: 1500px; top: 558px; width: 284px; padding: 8px 14px; border-radius: 10px; background: var(--green); color: #fff; font-size: 22px; font-weight: 500; white-space: nowrap; box-shadow: var(--shadow-2); }
        #s3-cursor { position: absolute; left: 0; top: 0; width: 56px; height: 56px; }
        #s3-ripple { position: absolute; left: 1214px; top: 794px; width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--blue); }
        #s3-bottom { position: absolute; left: 120px; right: 120px; top: 952px; text-align: center; font-size: 34px; font-weight: 500; color: var(--ink); }
      </style>

      <div id="root" data-composition-id="s3-solution" data-width="1920" data-height="1080">
        <div class="stage" id="s3-stage">
          <div id="s3-eyebrow" class="eyebrow"><span class="num">2</span>解決の考え方</div>
          <div id="s3-title" class="h1"></div>

          <svg id="s3-svg" viewBox="0 0 1920 1080">
            <defs>
              <marker id="s3-head-y" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b06000" /></marker>
              <marker id="s3-head-g" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#188038" /></marker>
            </defs>
            <path id="s3-a1" d="M 1400 640 L 1400 690" stroke="#b06000" stroke-width="5" fill="none" marker-end="url(#s3-head-y)" />
            <path id="s3-a2" d="M 1564 810 L 1730 810 L 1730 650" stroke="#188038" stroke-width="5" fill="none" stroke-linejoin="round" marker-end="url(#s3-head-g)" />
          </svg>

          <div id="s3-auto" class="card s3-cal">
            <div class="s3-head"><i class="sq" style="background: var(--blue)"></i>起動用カレンダー<span class="chip blue">命令</span></div>
            <div class="s3-desc">頼みたい仕事を自然言語で書く。その時刻に agent が動く</div>
            <div class="s3-ev"><div class="t">毎朝 9:00 の予定</div><div class="n" id="s3-n1"></div></div>
            <div class="s3-out" id="s3-o1">
              <span class="chip gray">9:00 になる</span>
              <svg class="arr" viewBox="0 0 40 24"><path d="M2 12 H32 M24 4 L34 12 L24 20" stroke="#5f6368" stroke-width="3" fill="none" /></svg>
              <span class="chip blue">agent が動く</span>
            </div>
          </div>

          <div id="s3-rec" class="card s3-cal">
            <div class="s3-head"><i class="sq" style="background: var(--green)"></i>記録用カレンダー<span class="chip green">事実</span></div>
            <div class="s3-desc">締切を書き、notes に「準備: 30日前」と 1 行添える</div>
            <div class="s3-ev"><div class="t">パスポート更新 締切</div><div class="n" id="s3-n2"></div></div>
            <div class="s3-out" id="s3-o2">
              <span class="chip gray">期日の 30日前</span>
              <svg class="arr" viewBox="0 0 40 24"><path d="M2 12 H32 M24 4 L34 12 L24 20" stroke="#5f6368" stroke-width="3" fill="none" /></svg>
              <span class="chip green">準備が始まる</span>
            </div>
          </div>

          <div id="s3-l1" class="chip yellow s3-label">準備の agent が予定を提案</div>
          <div id="s3-l2" class="chip green s3-label">承認したときだけ書く</div>

          <div id="s3-appr" class="card">
            <div class="l">
              <div class="h"><span class="ic"><svg viewBox="0 0 24 24"><path d="M6 2h12v5l-4 5 4 5v5H6v-5l4-5-4-5z" fill="none" stroke="#b06000" stroke-width="2" stroke-linejoin="round" /></svg></span>承認待ち</div>
              <div class="d"><span>agent はカレンダーに直接書けない。</span><span>予定の追加は承認待ちに入り、</span><span>人が承認したときだけ記録用カレンダーに入る</span></div>
            </div>
            <div id="s3-prop">
              <div class="k">記録用カレンダーに予定を追加</div>
              <div class="v">パスポート写真の準備</div>
              <div id="s3-btn">承認して追加<span class="done">承認済み</span></div>
            </div>
          </div>

          <div id="s3-fly">＋ パスポート写真の準備</div>
          <div id="s3-ripple"></div>
          <svg id="s3-cursor" viewBox="0 0 28 28"><path d="M4 2 L4 22 L9.5 17 L13 25 L16.5 23.5 L13 15.8 L20.5 15.8 z" fill="#202124" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" /></svg>

          <div id="s3-bottom"></div>
        </div>
      </div>

      <script>
        (function () {
          const D = 20;
          const tl = gsap.timeline({ paused: true });
          const q = (s) => document.querySelector(s);

          function split(el, text, cls) {
            el.textContent = "";
            return [...text].map((c) => {
              const s = document.createElement("span");
              s.textContent = c;
              if (cls) s.className = cls;
              el.appendChild(s);
              return s;
            });
          }
          function notes(el, text) {
            el.textContent = "";
            const l = document.createElement("span");
            l.className = "lbl";
            l.textContent = "notes";
            el.appendChild(l);
            const box = document.createElement("span");
            el.appendChild(box);
            return split(box, text, "c");
          }

          // 見出し: 「Google Calendar を、」までを青で
          const head = "Google Calendar を、";
          const t1 = split(q("#s3-title"), head + "agent の起動台帳にする");
          t1.slice(0, head.length).forEach((s) => s.classList.add("em"));
          const n1 = notes(q("#s3-n1"), "今週の締切を確認して、遅れている準備を教えて");
          const n2 = notes(q("#s3-n2"), "準備: 30日前");
          const bottom = split(q("#s3-bottom"), "人は新しい画面を覚えなくていい。いつもの Google Calendar で足す・動かす・消す");

          // 矢印は線を伸ばして描く
          const a1 = q("#s3-a1");
          const a2 = q("#s3-a2");
          const L1 = 50;
          const L2 = 166 + 160;

          // 初期状態
          gsap.set([t1, n1, n2, bottom], { opacity: 0 });
          gsap.set(["#s3-auto", "#s3-rec", "#s3-appr", "#s3-l1", "#s3-l2", "#s3-fly", "#s3-ripple", "#s3-cursor", "#s3-btn .done"], { opacity: 0 });
          gsap.set(["#s3-o1 > *", "#s3-o2 > *", ".s3-ev", ".s3-desc", "#s3-prop"], { opacity: 0 });
          gsap.set(a1, { attr: { "stroke-dasharray": L1, "stroke-dashoffset": L1 }, opacity: 0 });
          gsap.set(a2, { attr: { "stroke-dasharray": L2, "stroke-dashoffset": L2 }, opacity: 0 });

          window.ACSeam.enter(tl, "#s3-stage");

          // 0.2s 見出し
          tl.fromTo("#s3-eyebrow", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power4.out" }, 0.2);
          tl.fromTo(t1, { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, stagger: 0.025, ease: "power4.out" }, 0.4);

          // 2.0s 起動用カレンダー: 自然言語の notes を書くと、その時刻に agent が動く
          tl.fromTo("#s3-auto", { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power4.out" }, 2.0);
          tl.fromTo("#s3-auto .s3-desc", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power4.out" }, 2.4);
          tl.fromTo("#s3-auto .s3-ev", { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power4.out" }, 2.9);
          n1.forEach((s, i) => tl.set(s, { opacity: 1 }, 3.3 + i * 0.055));
          tl.fromTo("#s3-o1 > *", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, stagger: 0.22, ease: "power4.out" }, 5.0);
          tl.to("#s3-o1 .chip.blue", { scale: 1.12, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.out" }, 5.55);

          // 6.0s 記録用カレンダー: 締切と「準備: 30日前」で、期日の 30 日前に準備が始まる
          tl.fromTo("#s3-rec", { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power4.out" }, 6.0);
          tl.fromTo("#s3-rec .s3-desc", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power4.out" }, 6.4);
          tl.fromTo("#s3-rec .s3-ev", { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power4.out" }, 6.9);
          n2.forEach((s, i) => tl.set(s, { opacity: 1 }, 7.3 + i * 0.09));
          tl.fromTo("#s3-o2 > *", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, stagger: 0.22, ease: "power4.out" }, 8.4);
          tl.to("#s3-o2 .chip.green", { scale: 1.12, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.out" }, 8.95);

          // 10.0s 準備の agent が予定を提案 → 承認待ち
          tl.set(a1, { opacity: 1 }, 10.0);
          tl.to(a1, { attr: { "stroke-dashoffset": 0 }, duration: 0.35, ease: "power2.out" }, 10.0);
          tl.fromTo("#s3-l1", { x: 30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power4.out" }, 10.15);
          tl.fromTo("#s3-appr", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power4.out" }, 10.35);
          tl.fromTo("#s3-prop", { x: 40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power4.out" }, 11.1);

          // 12.6s カーソルが入り、13.5s「承認して追加」を押す
          tl.set("#s3-cursor", { opacity: 1 }, 12.6);
          tl.fromTo("#s3-cursor", { x: 1700, y: 1060 }, { x: 1266, y: 850, duration: 0.8, ease: "power3.out" }, 12.6);
          tl.to("#s3-cursor", { scale: 0.85, duration: 0.08, transformOrigin: "10% 5%" }, 13.5);
          tl.to("#s3-cursor", { scale: 1, duration: 0.15 }, 13.58);
          tl.to("#s3-btn", { scale: 0.92, duration: 0.08 }, 13.5);
          tl.to("#s3-btn", { scale: 1, duration: 0.2, ease: "back.out(1.6)" }, 13.58);
          tl.set("#s3-ripple", { opacity: 1 }, 13.5);
          tl.fromTo("#s3-ripple", { scale: 0.2 }, { scale: 1.2, duration: 0.5, ease: "power2.out" }, 13.5);
          tl.to("#s3-ripple", { opacity: 0, duration: 0.4, ease: "none" }, 13.6);
          tl.to("#s3-btn .done", { opacity: 1, duration: 0.2 }, 13.6);

          // 14.1s 間のあと、承認した予定が記録用カレンダーへ入る
          tl.to("#s3-cursor", { x: 1360, y: 1020, opacity: 0, duration: 0.5, ease: "power2.in" }, 13.9);
          tl.set(a2, { opacity: 1 }, 14.1);
          tl.to(a2, { attr: { "stroke-dashoffset": 0 }, duration: 0.6, ease: "power2.inOut" }, 14.1);
          tl.fromTo("#s3-l2", { y: -16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power4.out" }, 14.3);
          tl.set("#s3-fly", { opacity: 1 }, 14.2);
          tl.fromTo("#s3-fly", { x: -330, y: 196, scale: 0.9 }, { x: 90, y: 228, scale: 1, duration: 0.45, ease: "power2.in" }, 14.2);
          tl.to("#s3-fly", { x: 0, y: 0, duration: 0.5, ease: "power3.out" }, 14.65);
          tl.to("#s3-rec", { boxShadow: "0 0 0 6px rgba(52,168,83,.35), 0 4px 8px 3px rgba(60,64,67,.15)", duration: 0.2, yoyo: true, repeat: 1 }, 15.1);

          // 16.3s 最後の一行
          tl.fromTo(bottom, { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, stagger: 0.016, ease: "power4.out" }, 16.3);

          window.ACSeam.exit(tl, "#s3-stage", D);
          window.__timelines["s3-solution"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
