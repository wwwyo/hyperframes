<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>デモ① 締切を書く</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        #d1-deadline-view {
          position: relative;
          margin-top: 28px;
          height: 700px;
          overflow: hidden;
          border: 1px solid var(--border-strong);
          border-radius: 12px;
        }
        #d1-deadline-img {
          position: absolute;
          left: 0;
          top: 0;
          width: 1600px;
          display: block;
        }
        #d1-deadline .h {
          font-size: 52px;
        }
      </style>
      <div
        id="root"
        data-composition-id="d1-deadline"
        data-width="1920"
        data-height="1080"
        data-duration="16"
      >
        <div class="scene">
          <div class="stage" id="d1-deadline-stage">
            <span class="eyebrow"><b>04 / デモ① 締切を書く</b></span>
            <h2 class="h" id="d1-deadline-title" style="margin-top: 12px; font-size: 52px">
              締切を書くと、準備が始まる
            </h2>
            <div id="d1-deadline-view">
              <img id="d1-deadline-img" src="assets/dashboard.png" alt="dashboard" />
            </div>
          </div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const ease = "power4.out";
        const enter = (sel, t) =>
          tl.fromTo(sel, { x: 160, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease }, t);
        const exit = (sel, end) =>
          tl.to(sel, { x: -160, opacity: 0, duration: 0.45, ease: "power4.in" }, end - 0.45);
        const reveal = (sel, t, y = 24) =>
          tl.fromTo(
            sel,
            { y, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.6, ease, stagger: 0.12 },
            t,
          );

        enter("#d1-deadline-stage", 0);
        tl.fromTo(
          "#d1-deadline-img",
          { x: 0, y: 0 },
          { x: 0, y: -260, duration: 16, ease: "sine.inOut" },
          0,
        );
        exit("#d1-deadline-stage", 16);
        window.__timelines["d1-deadline"] = tl;
      </script>
    </template>
  </body>
</html>
