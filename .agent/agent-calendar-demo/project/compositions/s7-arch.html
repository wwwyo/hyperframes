<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>構成</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        #s7-arch-img {
          display: block;
          margin: 24px auto 0;
          height: 760px;
          border-radius: 12px;
        }
      </style>
      <div
        id="root"
        data-composition-id="s7-arch"
        data-width="1920"
        data-height="1080"
        data-duration="14"
      >
        <div class="scene">
          <div class="stage" id="s7-arch-stage">
            <span class="eyebrow"><b>06 / 構成</b></span>
            <img id="s7-arch-img" src="assets/architecture.png" alt="構成図" />
          </div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const ease = "power4.out";
        const enter = (sel, t) =>
          tl.fromTo(sel, { x: 160, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease }, t);
        const exit = (sel, end) =>
          tl.to(sel, { x: -160, opacity: 0, duration: 0.45, ease: "power4.in" }, end - 0.45);
        const reveal = (sel, t, y = 24) =>
          tl.fromTo(
            sel,
            { y, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.6, ease, stagger: 0.12 },
            t,
          );

        enter("#s7-arch-stage", 0);
        reveal("#s7-arch-img", 0.4, 16);
        exit("#s7-arch-stage", 14);
        window.__timelines["s7-arch"] = tl;
      </script>
    </template>
  </body>
</html>
