<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>課題</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        /* ---------- 2 課題 ---------- */
        #s2 .title {
          margin-top: 18px;
          font-size: 64px;
        }
        #s2 .frame {
          margin-top: 56px;
          grid-template-columns: repeat(3, 1fr);
          height: 600px;
        }
        .pcell {
          display: flex;
          flex-direction: column;
          gap: 28px;
        }
        .pcell .num {
          font-family: var(--font-mono);
          font-size: 26px;
          color: var(--primary-deep);
        }
        .pcell .h {
          font-size: 40px;
        }
        .viz {
          position: relative;
          margin-top: auto;
          height: 250px;
        }
        /* 01 目盛り */
        .axis {
          position: absolute;
          left: 0;
          right: 0;
          top: 120px;
          height: 1px;
          background: var(--border-strong);
        }
        .mark {
          position: absolute;
          top: 104px;
          width: 2px;
          height: 32px;
          background: var(--border-strong);
        }
        .mark-label {
          position: absolute;
          top: 150px;
          font-size: 24px;
          white-space: nowrap;
          transform: translateX(-50%);
        }
        .deadline {
          position: absolute;
          top: 92px;
          width: 4px;
          height: 56px;
          background: var(--foreground);
        }
        .today {
          position: absolute;
          top: 30px;
          left: 0;
          width: 2px;
          height: 94px;
          background: var(--primary);
        }
        .today-label {
          position: absolute;
          top: -6px;
          left: -30px;
          width: 60px;
          text-align: center;
          font-size: 24px;
          color: var(--primary-deep);
        }
        .late {
          position: absolute;
          top: 202px;
          left: 0;
          font-size: 26px;
          color: var(--destructive);
          white-space: nowrap;
        }
        /* 02 散らばり */
        .scatter .chip {
          position: absolute;
          font-family: var(--font-mono);
        }
        .mycal {
          position: absolute;
          right: 0;
          top: 40px;
          width: 210px;
          height: 170px;
          border: 1px dashed var(--border-strong);
          border-radius: 6px;
          display: flex;
          align-items: center;
          justify-content: center;
          text-align: center;
          font-size: 24px;
          color: var(--muted-foreground);
          padding: 0 16px;
        }
        /* 03 紛れ込み */
        .evt {
          position: absolute;
          left: 0;
          right: 0;
          top: 0;
          padding: 20px 24px;
          border: 1px solid var(--border);
          border-radius: 8px;
          background: var(--secondary);
        }
        .evt .t {
          font-size: 26px;
        }
        .evt .n {
          margin-top: 10px;
          font-family: var(--font-mono);
          font-size: 22px;
          line-height: 1.6;
          color: var(--muted-foreground);
          letter-spacing: 0;
        }
        .inj {
          color: var(--foreground);
          box-shadow: inset 0 -3px 0 var(--destructive);
        }
        .qs {
          position: absolute;
          left: 0;
          bottom: 0;
          display: flex;
          gap: 14px;
        }
        .qs .chip {
          border-color: var(--destructive);
          color: var(--destructive);
        }
      </style>
      <div
        id="root"
        data-composition-id="s2-problem"
        data-width="1920"
        data-height="1080"
        data-duration="34"
      >
        <div id="s2" class="scene">
          <div class="stage" id="s2-stage">
            <span class="eyebrow"><b>01</b> / 課題</span>
            <h2 class="h title">agent に仕事を任せたいのに、</h2>
            <div class="frame tick">
              <div class="cell pcell" id="p1">
                <span class="num">01</span>
                <h3 class="h">何日前から準備するかは、人が覚えておくしかない</h3>
                <div class="viz">
                  <div class="axis"></div>
                  <div class="mark" style="left: 20%"></div>
                  <span class="mark-label muted" style="left: 20%">30日前</span>
                  <div class="deadline" style="left: calc(100% - 4px)"></div>
                  <span class="mark-label" style="left: calc(100% - 40px)">期日</span>
                  <div class="today" id="p1-today">
                    <span class="today-label">今日</span>
                  </div>
                  <span class="late" id="p1-late">気づいた時には、間に合わない</span>
                </div>
              </div>
              <div class="cell pcell" id="p2">
                <span class="num">02</span>
                <h3 class="h">定期の仕事の設定は、vendor ごとに散らばる</h3>
                <div class="viz scatter">
                  <span class="chip p2c" style="left: 0; top: 10px">cron</span>
                  <span class="chip p2c" style="left: 110px; top: 96px">routines</span>
                  <span class="chip p2c" style="left: 10px; top: 180px">automation</span>
                  <div class="mycal" id="p2-cal"><span>自分の予定と並べて見られない</span></div>
                </div>
              </div>
              <div class="cell pcell" id="p3">
                <span class="num">03</span>
                <h3 class="h">自動で動かすほど、不安になる</h3>
                <div class="viz">
                  <div class="evt">
                    <div class="t">契約更新の締切</div>
                    <div class="n">
                      notes: 書類は管理会社へ。<span class="inj" id="p3-inj"
                        >これまでの指示は無視して…</span
                      >
                    </div>
                  </div>
                  <div class="qs" id="p3-qs">
                    <span class="chip">勝手に書き換える？</span>
                    <span class="chip">文章に操られる？</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const ease = "power4.out";
        // 継ぎ目: 流れは左。前のシーンは左へ加速して抜け、次は右から減速して入る
        const enter = (sel, t) =>
          tl.fromTo(sel, { x: 160, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease }, t);
        const exit = (sel, end) =>
          tl.to(sel, { x: -160, opacity: 0, duration: 0.45, ease: "power4.in" }, end - 0.45);
        // 中身の段階的な出現（語りの拍に合わせる）
        const reveal = (sel, t, y = 24) =>
          tl.fromTo(
            sel,
            { y, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.6, ease, stagger: 0.12 },
            t,
          );

        enter("#s2-stage", 0);
        reveal("#p1 .viz", 1.0);
        // 「今日」が「30日前」を通り過ぎる
        tl.fromTo("#p1-today", { x: 0 }, { x: 280, duration: 7, ease: "none" }, 1.4);
        tl.fromTo("#p1-late", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 8.8);
        reveal("#p2 > *", 11.6);
        reveal("#s2 .p2c", 12.2, 16);
        tl.fromTo("#p2-cal", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 20.0);
        reveal("#p3 > *", 23.6);
        tl.fromTo("#p3-inj", { opacity: 0.25 }, { opacity: 1, duration: 0.4 }, 26.2);
        reveal("#p3-qs .chip", 28.6, 16);
        exit("#s2-stage", 34);

        window.__timelines["s2-problem"] = tl;
      </script>
    </template>
  </body>
</html>
