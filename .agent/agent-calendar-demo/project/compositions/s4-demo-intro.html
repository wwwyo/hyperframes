<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>デモ導入</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        /* ---------- 4 デモ導入 ---------- */
        #s4 .title {
          margin-top: 18px;
          font-size: 88px;
        }
        #s4 .frame {
          margin-top: 64px;
          grid-template-columns: repeat(3, 1fr);
        }
        #s4 .frame > .cell {
          padding: 44px 32px;
        }
        .step {
          display: grid;
          gap: 18px;
        }
        .step .n {
          font-family: var(--font-mono);
          font-size: 30px;
          color: var(--primary-deep);
        }
        .step .h {
          font-size: 48px;
        }
        .step .d {
          font-size: 26px;
          line-height: 1.6;
        }
        .url {
          margin-top: 48px;
          font-family: var(--font-mono);
          font-size: 26px;
          color: var(--muted-foreground);
          letter-spacing: 0;
        }
      </style>
      <div
        id="root"
        data-composition-id="s4-demo-intro"
        data-width="1920"
        data-height="1080"
        data-duration="10"
      >
        <div id="s4" class="scene">
          <div class="stage" id="s4-stage">
            <span class="eyebrow"><b>03</b> / デモ</span>
            <h2 class="h title">3つの操作で見る</h2>
            <div class="frame tick">
              <div class="cell step s4-step">
                <span class="n">1</span>
                <h3 class="h">締切を書く</h3>
                <span class="d muted">準備が始まり、実行記録が残る</span>
              </div>
              <div class="cell step s4-step">
                <span class="n">2</span>
                <h3 class="h">承認する</h3>
                <span class="d muted">承認したときだけ書かれる</span>
              </div>
              <div class="cell step s4-step">
                <span class="n">3</span>
                <h3 class="h">定期の仕事を置く</h3>
                <span class="d muted">言葉で書くと、agent が動く</span>
              </div>
            </div>
            <div class="url" id="s4-url">agent-calendar-785713600547.asia-northeast1.run.app</div>
          </div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const ease = "power4.out";
        // 継ぎ目: 流れは左。前のシーンは左へ加速して抜け、次は右から減速して入る
        const enter = (sel, t) =>
          tl.fromTo(sel, { x: 160, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease }, t);
        const exit = (sel, end) =>
          tl.to(sel, { x: -160, opacity: 0, duration: 0.45, ease: "power4.in" }, end - 0.45);
        // 中身の段階的な出現（語りの拍に合わせる）
        const reveal = (sel, t, y = 24) =>
          tl.fromTo(
            sel,
            { y, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.6, ease, stagger: 0.12 },
            t,
          );

        enter("#s4-stage", 0);
        reveal(".s4-step:nth-child(1) > *", 5.2);
        reveal(".s4-step:nth-child(2) > *", 6.3);
        reveal(".s4-step:nth-child(3) > *", 7.4);
        reveal("#s4-url", 8.2, 0);
        exit("#s4-stage", 10);

        window.__timelines["s4-demo-intro"] = tl;
      </script>
    </template>
  </body>
</html>
