<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>次に作るもの</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        #s8-next-list {
          margin: 48px 0 0;
          padding: 0;
          list-style: none;
          display: grid;
          gap: 28px;
        }
        #s8-next-list li {
          padding: 24px 32px;
          border: 1px solid var(--border);
          border-left: 4px solid var(--primary);
          border-radius: 8px;
          background: var(--secondary);
          font-size: 38px;
          line-height: 1.5;
        }
      </style>
      <div
        id="root"
        data-composition-id="s8-next"
        data-width="1920"
        data-height="1080"
        data-duration="12"
      >
        <div class="scene">
          <div class="stage" id="s8-next-stage">
            <span class="eyebrow"><b>07 / 次に作るもの</b></span>
            <h2 class="h" style="margin-top: 18px; font-size: 72px">
              カレンダーに言葉で書くと、どこでも agent が動く
            </h2>
            <ul id="s8-next-list">
              <li>
                起動用カレンダーに自然言語で書くと、実行先・agent・作業場所を判定して発火前に見せる
              </li>
              <li>
                cloud は使い捨ての sandbox、local は本人の Mac で codex・claude などが起動する
              </li>
            </ul>
          </div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const ease = "power4.out";
        const enter = (sel, t) =>
          tl.fromTo(sel, { x: 160, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease }, t);
        const exit = (sel, end) =>
          tl.to(sel, { x: -160, opacity: 0, duration: 0.45, ease: "power4.in" }, end - 0.45);
        const reveal = (sel, t, y = 24) =>
          tl.fromTo(
            sel,
            { y, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.6, ease, stagger: 0.12 },
            t,
          );

        enter("#s8-next-stage", 0);
        reveal("#s8-next-list li:nth-child(1)", 1.0);
        reveal("#s8-next-list li:nth-child(2)", 6.0);
        exit("#s8-next-stage", 12);
        window.__timelines["s8-next"] = tl;
      </script>
    </template>
  </body>
</html>
