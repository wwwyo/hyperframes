<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>まとめ</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        #s9-end {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 760px;
          gap: 32px;
          text-align: center;
        }
        #s9-end .wordmark {
          font-size: 140px;
          line-height: 1;
          letter-spacing: -0.025em;
        }
      </style>
      <div
        id="root"
        data-composition-id="s9-closing"
        data-width="1920"
        data-height="1080"
        data-duration="6"
      >
        <div class="scene">
          <div class="stage" id="s9-closing-stage">
            <div id="s9-end">
              <span class="h" style="font-size: 52px"
                >いつもの Google Calendar で、agent を動かす</span
              >
              <span class="h wordmark" style="color: var(--primary-deep)">agent-calendar</span>
              <span class="mono muted" style="font-size: 28px"
                >github.com/wwwyo/agent-calendar</span
              >
            </div>
          </div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const ease = "power4.out";
        const enter = (sel, t) =>
          tl.fromTo(sel, { x: 160, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease }, t);
        const exit = (sel, end) =>
          tl.to(sel, { x: -160, opacity: 0, duration: 0.45, ease: "power4.in" }, end - 0.45);
        const reveal = (sel, t, y = 24) =>
          tl.fromTo(
            sel,
            { y, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.6, ease, stagger: 0.12 },
            t,
          );

        enter("#s9-closing-stage", 0);
        reveal("#s9-end > *", 0.3);
        exit("#s9-closing-stage", 6);
        window.__timelines["s9-closing"] = tl;
      </script>
    </template>
  </body>
</html>
