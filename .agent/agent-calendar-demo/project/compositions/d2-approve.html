<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>デモ② 承認</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        #d2-approve-view {
          position: relative;
          margin-top: 28px;
          height: 700px;
          overflow: hidden;
          border: 1px solid var(--border-strong);
          border-radius: 12px;
        }
        #d2-approve-img {
          position: absolute;
          left: 0;
          top: 0;
          width: 2600px;
          display: block;
        }
        #d2-approve .h {
          font-size: 52px;
        }
      </style>
      <div
        id="root"
        data-composition-id="d2-approve"
        data-width="1920"
        data-height="1080"
        data-duration="14"
      >
        <div class="scene">
          <div class="stage" id="d2-approve-stage">
            <span class="eyebrow"><b>04 / デモ② 承認する</b></span>
            <h2 class="h" id="d2-approve-title" style="margin-top: 12px; font-size: 52px">
              承認したときだけ、カレンダーに書かれる
            </h2>
            <div id="d2-approve-view">
              <img id="d2-approve-img" src="assets/dashboard.png" alt="dashboard" />
            </div>
          </div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const ease = "power4.out";
        const enter = (sel, t) =>
          tl.fromTo(sel, { x: 160, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease }, t);
        const exit = (sel, end) =>
          tl.to(sel, { x: -160, opacity: 0, duration: 0.45, ease: "power4.in" }, end - 0.45);
        const reveal = (sel, t, y = 24) =>
          tl.fromTo(
            sel,
            { y, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.6, ease, stagger: 0.12 },
            t,
          );

        enter("#d2-approve-stage", 0);
        tl.fromTo(
          "#d2-approve-img",
          { x: -1100, y: -450 },
          { x: -1050, y: -760, duration: 14, ease: "sine.inOut" },
          0,
        );
        exit("#d2-approve-stage", 14);
        window.__timelines["d2-approve"] = tl;
      </script>
    </template>
  </body>
</html>
