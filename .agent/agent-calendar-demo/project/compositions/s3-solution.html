<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>解決</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        /* ---------- 3 解決 ---------- */
        #s3 .title {
          font-size: 64px;
        }
        #s3 .title em {
          font-style: normal;
          color: var(--primary-deep);
        }
        #s3 .frame {
          margin-top: 40px;
          grid-template-columns: 1fr 1fr;
        }
        .cal {
          display: grid;
          gap: 16px;
          align-content: start;
        }
        .cal-head {
          display: flex;
          align-items: baseline;
          gap: 18px;
        }
        .cal-head .h {
          font-size: 38px;
        }
        .cal-head .role {
          font-size: 26px;
          color: var(--muted-foreground);
        }
        .ev {
          padding: 18px 22px;
          border: 1px solid var(--border-strong);
          border-left: 4px solid var(--primary);
          border-radius: 8px;
          background: var(--secondary);
          display: grid;
          gap: 10px;
        }
        .ev .t {
          font-size: 30px;
        }
        .ev .when {
          font-family: var(--font-mono);
          font-size: 22px;
          color: var(--muted-foreground);
          letter-spacing: 0;
        }
        .notes-label {
          font-family: var(--font-mono);
          font-size: 20px;
          color: var(--muted-foreground);
          letter-spacing: 0;
        }
        .flow {
          display: flex;
          align-items: center;
          gap: 18px;
          font-size: 30px;
        }
        .flow .arrow {
          font-family: var(--font-mono);
          color: var(--primary);
        }
        .flow .chips {
          display: flex;
          gap: 12px;
        }
        /* 締めの一行は見出しと同じ位置に入れ替わる */
        #s3 .headline {
          position: relative;
          margin-top: 18px;
        }
        #s3 .closing {
          position: absolute;
          left: 0;
          top: 0;
          margin: 0;
          font-size: 56px;
          line-height: 1.3;
          white-space: nowrap;
        }
        #s3 .frame > .cell {
          padding: 32px 36px;
        }
        #s3 .closing b {
          font-weight: 500;
          color: var(--primary-deep);
        }
      </style>
      <div
        id="root"
        data-composition-id="s3-solution"
        data-width="1920"
        data-height="1080"
        data-duration="36"
      >
        <div id="s3" class="scene">
          <div class="stage" id="s3-stage">
            <span class="eyebrow"><b>02</b> / 解決</span>
            <div class="headline">
              <h2 class="h title" id="s3-title">
                Google Calendar を、そのまま <em>agent の起動台帳</em>にする
              </h2>
              <p class="h closing" id="s3-closing">
                いつもの Google Calendar で、<b>足す・動かす・消す</b>
              </p>
            </div>
            <div class="frame tick" id="s3-frame">
              <div class="cell cal" id="s3-rec">
                <div class="cal-head">
                  <h3 class="h">記録用カレンダー</h3>
                  <span class="role">事実</span>
                </div>
                <div class="ev">
                  <span class="t">パスポート更新</span>
                  <span class="when">期日の予定</span>
                  <span class="notes-label">notes</span>
                  <div class="code" id="s3-rec-note">準備: 30日前</div>
                </div>
                <div class="flow" id="s3-rec-flow">
                  <span class="arrow">→</span>
                  <span>期日の30日前、agent が準備を始める</span>
                </div>
                <div class="flow" id="s3-rec-out">
                  <span class="arrow">→</span>
                  <span class="chip">準備の予定を提案</span>
                </div>
              </div>
              <div class="cell cal" id="s3-run">
                <div class="cal-head">
                  <h3 class="h">起動用カレンダー</h3>
                  <span class="role">命令</span>
                </div>
                <div class="ev">
                  <span class="t">朝の締切チェック</span>
                  <span class="when">繰り返しの予定</span>
                  <span class="notes-label">notes</span>
                  <div class="code" id="s3-run-note">
                    今週の締切を確認して、遅れている準備を教えて
                  </div>
                </div>
                <div class="flow" id="s3-run-flow">
                  <span class="arrow">→</span>
                  <span>その時刻に、agent が動く</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const ease = "power4.out";
        // 継ぎ目: 流れは左。前のシーンは左へ加速して抜け、次は右から減速して入る
        const enter = (sel, t) =>
          tl.fromTo(sel, { x: 160, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease }, t);
        const exit = (sel, end) =>
          tl.to(sel, { x: -160, opacity: 0, duration: 0.45, ease: "power4.in" }, end - 0.45);
        // 中身の段階的な出現（語りの拍に合わせる）
        const reveal = (sel, t, y = 24) =>
          tl.fromTo(
            sel,
            { y, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.6, ease, stagger: 0.12 },
            t,
          );

        enter("#s3-stage", 0);
        reveal("#s3-frame", 5.6);
        tl.fromTo(
          "#s3-rec-note",
          { boxShadow: "0 0 0 0px rgba(168, 85, 247, 0)" },
          { boxShadow: "0 0 0 2px rgba(168, 85, 247, 1)", duration: 0.4 },
          8.4,
        );
        reveal("#s3-rec-flow", 11.0, 0);
        reveal("#s3-rec-out", 13.6, 0);
        reveal(["#s3-run .cal-head", "#s3-run .ev"], 16.0);
        tl.fromTo(
          "#s3-run-note",
          { boxShadow: "0 0 0 0px rgba(168, 85, 247, 0)" },
          { boxShadow: "0 0 0 2px rgba(168, 85, 247, 1)", duration: 0.4 },
          18.6,
        );
        reveal("#s3-run-flow", 21.0, 0);

        tl.to(
          ["#s3-rec-note", "#s3-run-note"],
          { boxShadow: "0 0 0 0px rgba(168, 85, 247, 0)", duration: 0.4 },
          25.6,
        );
        tl.to("#s3-title", { y: -24, opacity: 0, duration: 0.4, ease: "power4.in" }, 25.6);
        reveal("#s3-closing", 26.0);
        exit("#s3-stage", 36);

        window.__timelines["s3-solution"] = tl;
      </script>
    </template>
  </body>
</html>
