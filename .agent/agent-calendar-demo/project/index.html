<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>agent-calendar 提出デモ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=Geist+Mono:wght@400;500&display=swap"
    />
    <script src="assets/gsap.min.js"></script>
    <style>
      /* 和文は design.md に従い OS の角ゴ（ヒラギノ）に落とす */
      @font-face {
        font-family: "AC JP";
        src: local("HiraginoSans-W3"), local("Hiragino Sans W3");
        font-weight: 400;
      }
      @font-face {
        font-family: "AC JP";
        src: local("HiraginoSans-W5"), local("Hiragino Sans W5");
        font-weight: 500;
      }
      /* 値は agent-calendar/design.md の Tokens。動画用に文字と余白だけ拡大する */
      :root {
        --background: #0f0b16;
        --foreground: #f0eaf7;
        --secondary: #16101f;
        --muted-foreground: #9e93ac;
        --accent: #1c1428;
        --primary: #a855f7;
        --primary-foreground: #12061c;
        --primary-hover: #bf7dff;
        --primary-deep: #d9b3ff;
        --glow-1: #d8a8ff;
        --glow-2: #f6e9ff;
        --destructive: #ff5f7a;
        --success: #4de0a8;
        --border: #2a2137;
        --border-strong: #3c3050;
        --dot: #241c30;
        --font-sans: "Inter Tight", "AC JP", sans-serif;
        --font-mono: "Geist Mono", "AC JP", monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--background);
      }
      #main-root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--background);
        color: var(--foreground);
        font-family: var(--font-sans);
        letter-spacing: 0.02em;
        line-break: strict;
      }
      .guides {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle, var(--dot) 1.4px, transparent 1.4px) 0 0 / 24px 24px;
      }
      .rail {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 1px;
        background: linear-gradient(180deg, var(--border-strong) 50%, transparent 0) 0 0 / 1px 32px
          repeat-y;
      }
      .scene {
        position: absolute;
        inset: 0;
      }
      .stage {
        position: absolute;
        inset: 0;
        padding: 96px 160px 0;
      }
      .h {
        margin: 0;
        font-weight: 500;
        line-height: 1.3;
        letter-spacing: 0;
        font-feature-settings: "palt";
        word-break: keep-all;
      }
      .mono {
        font-family: var(--font-mono);
        letter-spacing: 0;
      }
      .eyebrow {
        display: block;
        font-family: var(--font-mono);
        font-size: 24px;
        color: var(--muted-foreground);
        letter-spacing: 0.04em;
      }
      .eyebrow b {
        color: var(--primary-deep);
        font-weight: 500;
      }
      .muted {
        color: var(--muted-foreground);
      }
      /* hairline の枠と中空の corner tick */
      .frame {
        display: grid;
        gap: 1px;
        border: 1px solid var(--border);
        background: var(--border);
      }
      .frame > .cell {
        background: var(--background);
        padding: 44px 40px;
        min-width: 0;
      }
      .tick {
        position: relative;
      }
      .tick::before {
        content: "";
        position: absolute;
        z-index: 2;
        inset: -7px;
        pointer-events: none;
        background:
          linear-gradient(var(--background) 0 0) 2px 2px,
          linear-gradient(var(--background) 0 0) calc(100% - 2px) 2px,
          linear-gradient(var(--background) 0 0) 2px calc(100% - 2px),
          linear-gradient(var(--background) 0 0) calc(100% - 2px) calc(100% - 2px),
          linear-gradient(var(--border-strong) 0 0) 0 0,
          linear-gradient(var(--border-strong) 0 0) 100% 0,
          linear-gradient(var(--border-strong) 0 0) 0 100%,
          linear-gradient(var(--border-strong) 0 0) 100% 100%;
        background-repeat: no-repeat;
        background-size:
          10px 10px,
          10px 10px,
          10px 10px,
          10px 10px,
          14px 14px,
          14px 14px,
          14px 14px,
          14px 14px;
      }
      .chip {
        display: inline-block;
        padding: 4px 14px;
        border: 1px solid var(--border-strong);
        border-radius: 6px;
        background: var(--secondary);
        font-size: 24px;
        white-space: nowrap;
      }
      .chip.purple {
        border-color: var(--primary);
        color: var(--primary-deep);
      }
      .code {
        padding: 18px 22px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--secondary);
        font-family: var(--font-mono);
        font-size: 26px;
        line-height: 1.6;
        letter-spacing: 0;
      }

      /* ---------- placeholder ---------- */
      .ph {
        position: absolute;
        left: 160px;
        right: 160px;
        top: 96px;
        bottom: 220px;
        padding: 56px 64px;
        border: 2px dashed var(--border-strong);
        border-radius: 16px;
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        gap: 28px;
      }
      .ph .tag {
        display: flex;
        gap: 16px;
        align-items: center;
      }
      .ph .tag .chip {
        font-family: var(--font-mono);
        font-size: 22px;
      }
      .ph .h {
        font-size: 60px;
      }
      .ph ul {
        margin: 0;
        padding-left: 1.2em;
        font-size: 30px;
        line-height: 1.7;
      }
      .ph .foot {
        font-family: var(--font-mono);
        font-size: 22px;
        color: var(--muted-foreground);
        letter-spacing: 0;
      }

      /* ---------- 字幕 ---------- */
      .cap {
        position: absolute;
        left: 160px;
        right: 160px;
        bottom: 64px;
        display: flex;
        justify-content: center;
      }
      .cap span {
        display: block;
        max-width: 1600px;
        padding: 12px 28px;
        border-radius: 8px;
        background: rgba(15, 11, 22, 0.88);
        font-size: 38px;
        line-height: 1.45;
        text-align: center;
        font-feature-settings: "palt";
      }

      [data-composition-id="main"] > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <!-- 構成と原稿は ../STORYBOARD.md。ph* は差し替え前提の placeholder -->
    <div
      id="main-root"
      data-composition-id="main"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="180"
    >
      <div class="guides"></div>
      <div class="rail" style="left: 120px"></div>
      <div class="rail" style="right: 120px"></div>
      <div
        id="s1-opening"
        data-composition-id="s1-opening"
        data-composition-src="compositions/s1-opening.html"
        data-start="0"
        data-duration="8"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="s2-problem"
        data-composition-id="s2-problem"
        data-composition-src="compositions/s2-problem.html"
        data-start="8"
        data-duration="34"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="s3-solution"
        data-composition-id="s3-solution"
        data-composition-src="compositions/s3-solution.html"
        data-start="42"
        data-duration="36"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="s4-demo-intro"
        data-composition-id="s4-demo-intro"
        data-composition-src="compositions/s4-demo-intro.html"
        data-start="78"
        data-duration="10"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="d1-deadline"
        data-composition-id="d1-deadline"
        data-composition-src="compositions/d1-deadline.html"
        data-start="88"
        data-duration="16"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="d2-approve"
        data-composition-id="d2-approve"
        data-composition-src="compositions/d2-approve.html"
        data-start="104"
        data-duration="14"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="d3-recurring"
        data-composition-id="d3-recurring"
        data-composition-src="compositions/d3-recurring.html"
        data-start="118"
        data-duration="12"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="s6-safety"
        data-composition-id="s6-safety"
        data-composition-src="compositions/s6-safety.html"
        data-start="130"
        data-duration="18"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="s7-arch"
        data-composition-id="s7-arch"
        data-composition-src="compositions/s7-arch.html"
        data-start="148"
        data-duration="14"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="s8-next"
        data-composition-id="s8-next"
        data-composition-src="compositions/s8-next.html"
        data-start="162"
        data-duration="12"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="s9-closing"
        data-composition-id="s9-closing"
        data-composition-src="compositions/s9-closing.html"
        data-start="174"
        data-duration="6"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-track-kind="captions"
        data-start="0"
        data-duration="180"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
