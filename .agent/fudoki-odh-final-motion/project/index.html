        }
        function boxIn(el, at, dur) {
          tl.fromTo(el, { strokeDasharray: 1, strokeDashoffset: 1, fillOpacity: 0 }, { strokeDashoffset: 0, fillOpacity: 1, duration: dur || 0.45, ease: "power2.out" }, at);
        }
        function popIn(el, at, from) {
          tl.fromTo(el, Object.assign({ opacity: 0, y: 16, scale: 0.96 }, from || {}), { opacity: 1, y: 0, scale: 1, duration: 0.38, ease: "power3.out" }, at);
        }
        function exitLeft(el, at) {
          tl.to(el, { x: -140, opacity: 0, duration: 0.55, ease: "power2.in" }, at);
        }

        // ---------- split text into chars
        function chars(el, text) {
          el.innerHTML = "";
          return Array.from(text).map((c) => {
            const s = document.createElement("span");
            s.className = "ch";
            s.textContent = c === " " ? " " : c;
            el.appendChild(s);
            return s;
          });
        }

        // initial hidden state for everything that enters later
        const hidden = [
          "#a-pdf", "#a-robot", "#a-beam", "#a-x", "#a-scanband",
          "#b-scan", "#b-marquee", "#b-cap-l", "#b-table", "#b-cap-r", "#b-panel", "#b-nonum", "#b-copy", "#b-cursor",
          "#c-spread", "#c-lab-red", "#c-lab-gray", "#c-lab-blue", "#c-arrowhead",
          "#v-cam", "#v-lab-blue", "#v-lab-red", "#v-h0", "#v-h1", "#v-h2", "#v-h3", "#v-bluehead", "#v-redhead",
          "#d-A", "#d-B", "#d-lab-A", "#d-lab-B", "#dA-tag-red", "#dA-tag-blue", "#dB-tag-red", "#dB-tag-blue",
        ];
        tl.set(hidden, { opacity: 0 }, 0);
        tl.set(["#c-red", "#c-gray", "#c-blue", "#c-arrow", "#v-redbox", "#v-blue", "#v-red", "#dA-red", "#dA-blue", "#dB-red", "#dB-blue"], { strokeDasharray: 1, strokeDashoffset: 1, fillOpacity: 0 }, 0);

        // =====================================================================
        // 3a  これを AI に解析させ……れません
        // =====================================================================
        const a = T.a;
        const l1 = chars($("#a-l1"), "AI に解析させ");
        const dots = chars($("#a-dots"), "……");
        const t2 = chars($("#a-t2"), "れません");
        tl.set([...l1, ...dots, ...t2], { opacity: 0 }, 0);
        $("#a-scanband").style.background = "linear-gradient(180deg, rgba(10,10,10,0) 0%, rgba(10,10,10,0.10) 80%, rgba(10,10,10,0.35) 100%)";

        // the page is laid down
        tl.fromTo("#a-pdf", { opacity: 0, y: -46, rotation: -2.5, scale: 1.035 }, { opacity: 1, y: 0, rotation: 0, scale: 1, duration: 0.9, ease: "power3.out" }, a + 0.45);
        // the robot arrives and leans in to read
        tl.fromTo("#a-robot", { opacity: 0, x: 260 }, { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" }, a + 2.0);
        tl.to("#a-robot", { x: -34, rotation: -7, transformOrigin: "50% 100%", duration: 0.55, ease: "power2.out" }, a + 2.85);
        tl.to("#a-eyes", { x: -26, duration: 0.3, ease: "power2.out" }, a + 2.9);
        tl.to("#a-beam", { opacity: 1, duration: 0.35, ease: "power1.out" }, a + 3.2);
        tl.set("#a-scanband", { opacity: 1, y: -90 }, a + 3.2);
        tl.to("#a-scanband", { y: 820, duration: 1.9, ease: "none" }, a + 3.2);
        tl.to("#a-beam-poly", { attr: { points: "1112,330 880,560 880,930" }, duration: 1.9, ease: "none" }, a + 3.2);
        tl.fromTo("#a-eyes", { y: -8 }, { y: 10, duration: 1.9, ease: "none" }, a + 3.2);
        // caption types while it reads
        tl.to(l1, { opacity: 1, duration: 0.01, stagger: 0.075 }, a + 3.3);
        tl.to(dots, { opacity: 1, duration: 0.01, stagger: 0.4 }, a + 4.4);
        // ...nothing. pause, then the X
        tl.to("#a-beam", { opacity: 0, duration: 0.2 }, a + 5.1);
        tl.to("#a-scanband", { opacity: 0, duration: 0.2 }, a + 5.1);
        tl.fromTo("#a-x", { opacity: 0, scale: 2.3, rotation: -8, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, rotation: 0, duration: 0.17, ease: "power4.in" }, a + 5.75);
        tl.to(t2, { opacity: 1, duration: 0.01, stagger: 0.035 }, a + 5.92);
        tl.fromTo("#a-t2", { y: -14 }, { y: 0, duration: 0.25, ease: "back.out(3)" }, a + 5.92);
        tl.to("#a-shake", { keyframes: [{ x: 16 }, { x: -12 }, { x: 8 }, { x: -4 }, { x: 0 }], duration: 0.34, ease: "none" }, a + 5.92);
        tl.to("#a-robot", { x: 4, rotation: 3, duration: 0.3, ease: "back.out(2)" }, a + 5.92);
        tl.to("#a-eyes", { x: 0, y: 0, duration: 0.2 }, a + 5.92);
        tl.to(["#a-eye-l", "#a-eye-r"], { attr: { height: 8, y: 183 }, duration: 0.12 }, a + 5.92);
        // static from ~6.3 to the cut at 8.0

        // =====================================================================
        // 3b  テキストがない／あっても文字化け
        // =====================================================================
        const b = T.b;
        exitLeft(["#a-pdf", "#a-robot", "#a-x"], b + 0.15);
        tl.to("#a-text", { y: 40, opacity: 0, duration: 0.45, ease: "power2.in" }, b + 0.15);

        popIn("#b-scan", b + 0.75, { y: 30 });
        // drag across the scan -> nothing selects
        const scanX = 80, scanY = 220;
        tl.set("#b-cursor", { x: scanX + 70, y: scanY + 70, opacity: 0 }, b);
        tl.to("#b-cursor", { opacity: 1, duration: 0.2 }, b + 1.3);
        tl.set("#b-marquee", { opacity: 1, left: scanX + 86, top: scanY + 100, width: 4, height: 4 }, b + 1.6);
        tl.to("#b-cursor", { x: scanX + 470, y: scanY + 300, duration: 1.0, ease: "power1.inOut" }, b + 1.6);
        tl.to("#b-marquee", { width: 400, height: 232, duration: 1.0, ease: "power1.inOut" }, b + 1.6);
        tl.to("#b-marquee", { keyframes: [{ opacity: 0.15 }, { opacity: 0.9 }, { opacity: 0.15 }, { opacity: 0 }], duration: 0.5, ease: "none" }, b + 2.75);
        popIn("#b-cap-l", b + 3.1);

        // table: drag-select the first three rows (目 + 節 + amounts)
        popIn("#b-table", b + 3.6, { y: 30 });
        const tk = 660 / 1431; // table image scale
        const rows = [
          { x0: 10, x1: 1420, y: 254 },
          { x0: 930, x1: 1420, y: 316 },
          { x0: 930, x1: 1420, y: 378 },
        ];
        const hlHost = $("#b-hls");
        rows.forEach((r, i) => {
          const d = document.createElement("div");
          d.className = "hl";
          d.id = "b-hl" + i;
          d.style.left = r.x0 * tk + "px";
          d.style.top = (r.y - 22) * tk + "px";
          d.style.width = (r.x1 - r.x0) * tk + "px";
          d.style.height = 46 * tk + "px";
          hlHost.appendChild(d);
          tl.fromTo(d, { opacity: 0, scaleX: 0, transformOrigin: "0% 50%" }, { opacity: 1, scaleX: 1, duration: 0.28, ease: "power1.out" }, b + 4.45 + i * 0.26);
        });
        tl.set("#b-cursor", { x: 700 + 6, y: 220 + 222 * tk - 4 }, b + 4.0);
        tl.to("#b-cursor", { opacity: 1, duration: 0.2 }, b + 4.1);
        tl.to("#b-cursor", { x: 700 + 1415 * tk, y: 220 + 400 * tk - 30, duration: 0.95, ease: "power1.inOut" }, b + 4.4);
        tl.set("#b-copy", { left: 700 + 1415 * tk - 40, top: 220 + 400 * tk + 44 }, b);
        popIn("#b-copy", b + 5.45, { y: 8 });
        tl.to("#b-cursor", { opacity: 0, duration: 0.2 }, b + 5.45);

        // paste: garbled text comes out
        popIn("#b-panel", b + 5.85, { y: 20 });
        const garbled = [
          ["㧗㱋⚟♴⥲ົ㈝", "高齢福祉総務費"],
          ["ሗ㓘", "報酬"],
          ["⤥ᩱ", "給料"],
          ["⫋ဨᡭᙜ➼", "職員手当等"],
        ];
        garbled.forEach((g, i) => {
          const wrap = document.createElement("div");
          wrap.className = "g-line";
          wrap.id = "b-g" + i;
          wrap.style.top = 84 + i * 118 + "px";
          const t = document.createElement("span");
          t.className = "g-text";
          if (i === 2) {
            // ⤥ + combining ᩱ: shape each separately so no single fallback font has to cover the cluster
            Array.from(g[0]).forEach((ch) => {
              const sp = document.createElement("span");
              sp.style.display = "inline-block";
              sp.textContent = ch;
              t.appendChild(sp);
            });
          } else {
            t.textContent = g[0];
          }
          const o = document.createElement("span");
          o.className = "g-orig";
          o.textContent = "← " + g[1];
          wrap.appendChild(t);
          wrap.appendChild(o);
          $("#b-panel").appendChild(wrap);
          tl.fromTo(wrap, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.26, ease: "power2.out" }, b + 6.25 + i * 0.32);
        });
        tl.to("#b-copy", { opacity: 0, duration: 0.25 }, b + 6.25);
        popIn("#b-cap-r", b + 6.25);
        popIn("#b-nonum", b + 7.75);
        // static from ~8.15 to the cut at 9.4

        // =====================================================================
        // 3c  見開きで初めて意味を持つ
        // =====================================================================
        const c = T.c;
        exitLeft(["#b-left", "#b-right"], c + 0.15);
        const cS = 860 / 1674;
        tl.set("#c-spread", { x: (1920 - 3076 * cS) / 2, y: 110, scale: cS }, 0);
        tl.fromTo("#c-spread", { opacity: 0, y: 140 }, { opacity: 1, y: 110, duration: 0.8, ease: "power3.out" }, c + 0.6);
        boxIn("#c-red", c + 2.2, 0.45);
        popIn("#c-lab-red", c + 2.55);
        boxIn("#c-gray", c + 3.15, 0.55);
        popIn("#c-lab-gray", c + 3.5);
        draw("#c-arrow", c + 4.05, 0.5, "power2.in");
        tl.fromTo("#c-arrowhead", { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.14 }, c + 4.52);
        boxIn("#c-blue", c + 4.6, 0.45);
        popIn("#c-lab-blue", c + 5.0);
        // static from ~5.4 to the cut at 7.2

        // =====================================================================
        // 3c-2  横に読む表に、急に縦読み
        // =====================================================================
        const v = T.c2;
        tl.to("#c-spread", { x: "-=420", opacity: 0, duration: 0.6, ease: "power2.in" }, v + 0.15);
        const ov = 1760 / 3525;
        const zs = 0.8;
        const zx = 282 - 1830 * zs;
        tl.set("#v-cam", { x: 80 + 260, y: (1080 - 1139 * ov) / 2, scale: ov }, 0);
        tl.to("#v-cam", { opacity: 1, x: 80, duration: 0.8, ease: "power3.out" }, v + 0.7);
        tl.to("#v-cam", { x: zx, y: 22, scale: zs, duration: 1.25, ease: "power2.inOut" }, v + 1.65);
        popIn("#v-lab-blue", v + 2.95);
        // blue: trace the row, pausing on each figure
        const bl = $("#v-blue");
        tl.fromTo(bl, { strokeDashoffset: 1 }, { strokeDashoffset: 0.6, duration: 0.6, ease: "power1.inOut" }, v + 3.05);
        tl.to("#v-h0", { opacity: 1, duration: 0.15 }, v + 3.05);
        tl.to("#v-h1", { opacity: 1, duration: 0.15 }, v + 3.5);
        tl.to(bl, { strokeDashoffset: 0.4, duration: 0.45, ease: "power1.inOut" }, v + 3.85);
        tl.to("#v-h2", { opacity: 1, duration: 0.15 }, v + 4.2);
        tl.to(bl, { strokeDashoffset: 0.0, duration: 0.6, ease: "power2.in" }, v + 4.5);
        tl.to("#v-h3", { opacity: 1, duration: 0.15 }, v + 4.85);
        tl.to("#v-bluehead", { opacity: 1, duration: 0.05 }, v + 5.08);
        // ...enters 備考 and stops dead
        tl.fromTo("#v-bluehead", { x: 0 }, { keyframes: [{ x: -10 }, { x: 0 }], duration: 0.25, ease: "power1.out" }, v + 5.1);
        // red: the same row's right edge is another business, read top to bottom
        boxIn("#v-redbox", v + 5.55, 0.4);
        draw("#v-red", v + 5.75, 0.7, "power2.in");
        tl.to("#v-redhead", { opacity: 1, duration: 0.06 }, v + 6.43);
        popIn("#v-lab-red", v + 6.5);
        // static from ~6.9 to the cut at 8.4

        // =====================================================================
        // 3d  自治体ごとに形式が違う（同じ縮尺）
        // =====================================================================
        const d = T.d;
        tl.to(["#v-cam", "#v-lab-blue", "#v-lab-red"], { opacity: 0, y: "+=30", duration: 0.5, ease: "power2.in" }, d + 0.15);
        const ds = 0.7986 / 3; // same px-per-pt for both documents
        const ax = 60, bx = 60 + 3076 * ds + 50, dy = 286;
        $("#d-lab-B").style.left = bx + "px";
        tl.set("#d-A", { x: ax, y: dy, scale: ds }, 0);
        tl.set("#d-B", { x: bx, y: dy, scale: ds }, 0);
        tl.fromTo("#d-A", { opacity: 0, y: dy + 60 }, { opacity: 1, y: dy, duration: 0.7, ease: "power3.out" }, d + 0.5);
        tl.fromTo("#d-B", { opacity: 0, y: dy + 60 }, { opacity: 1, y: dy, duration: 0.7, ease: "power3.out" }, d + 0.6);
        popIn("#d-lab-A", d + 0.75);
        popIn("#d-lab-B", d + 0.85);
        boxIn(["#dA-red", "#dB-red"], d + 1.5, 0.4);
        popIn(["#dA-tag-red", "#dB-tag-red"], d + 1.75);
        boxIn(["#dA-blue", "#dB-blue"], d + 2.25, 0.45);
        popIn(["#dA-tag-blue", "#dB-tag-blue"], d + 2.5);
        // static from ~2.9 to the cut at 4.8

        // =====================================================================
        // 3e  これが全自治体分ある
        // =====================================================================
        const e = T.e;
        const grid = $("#e-grid");
        const COLS = 15, ROWS = 6, CW = 128, CH = 180;
        const files = [];
        for (let i = 0; i < 88; i++) files.push("t" + String(i).padStart(2, "0") + ".png");
        // seeded shuffle (mulberry32)
        let seed = 20251017;
        const rnd = () => {
          seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
        const cellA = 2 * COLS + 3, cellB = 2 * COLS + 10; // where the two spreads land
        const cells = [];
        for (let i = 0; i < COLS * ROWS; i++) if (i !== cellA && i !== cellB) cells.push(i);
        for (let i = cells.length - 1; i > 0; i--) {
          const j = Math.floor(rnd() * (i + 1));
          [cells[i], cells[j]] = [cells[j], cells[i]];
        }
        function tile(idx, src, id) {
          const el = document.createElement("div");
          el.className = "tile";
          el.id = id;
          el.style.left = (idx % COLS) * CW + "px";
          el.style.top = Math.floor(idx / COLS) * CH + "px";
          const im = document.createElement("img");
          im.src = "assets/img/thumbs/" + src;
          im.alt = "";
          el.appendChild(im);
          grid.appendChild(el);
          tl.set(el, { opacity: 0 }, 0);
          return el;
        }
        const tA = tile(cellA, "tA.png", "e-tA");
        const tB = tile(cellB, "tB.png", "e-tB");
        // the two spreads shrink into their tiles
        tl.to(["#d-lab-A", "#d-lab-B", "#dA-tag-red", "#dA-tag-blue", "#dB-tag-red", "#dB-tag-blue"], { opacity: 0, duration: 0.3 }, e + 0.15);
        const cx = (i) => (i % COLS) * CW, cy = (i) => Math.floor(i / COLS) * CH;
        tl.to("#d-A", { x: cx(cellA), y: cy(cellA), scale: 128 / 1515, duration: 0.85, ease: "power3.inOut" }, e + 0.25);
        tl.to("#d-B", { x: cx(cellB) - 64, y: cy(cellB) + 6, scale: 256 / 3471, duration: 0.85, ease: "power3.inOut" }, e + 0.25);
        tl.to([tA, tB], { opacity: 1, duration: 0.25 }, e + 0.92);
        tl.to(["#d-A", "#d-B"], { opacity: 0, duration: 0.25 }, e + 0.92);
        // then the rest, one by one, accelerating
        let at = e + 1.25, step = 0.3;
        cells.forEach((ci, k) => {
          const el = tile(ci, files[k], "e-t" + k);
          tl.fromTo(el, { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power2.out" }, at);
          at += step;
          step = Math.max(0.016, step * 0.86);
        });
        // finally cover the two (sparse) spreads with dense pages, so no blank cell remains
        [[cellA, "t88.png"], [cellB, "t89.png"]].forEach(([ci, f], k) => {
          const el = tile(ci, f, "e-tc" + k);
          tl.fromTo(el, { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power2.out" }, at);
          at += step;
        });
        // last tile lands ~4.9s into the cut; static to the end

        tl.set({}, {}, T.end);
        window.__hfCuts = T;
        window.__timelines["fudoki-odh-v1"] = tl;
      })();
    </script>
  </body>
</html>
